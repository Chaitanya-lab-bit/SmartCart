<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SmartCart - Admin Dashboard</title>
</head>

<body>

    <h1>Welcome to SmartCart Admin Dashboard!</h1>

    <!-- Display Flash Messages -->
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
            <p>{{ message }}</p>
        {% endfor %}
    {% endwith %}

    <h2>Welcome, {{ admin_name }}!</h2>

    <p>You are successfully logged in.</p>
    <br>
    <a href="/admin/profile">My Profile</a>
    <br><br>
    <br>
    <a href="/admin/add-item">Add New Product</a>
    <br><br>
    <a href="/admin/item-list">View All Products</a>
    <br><br>

    <!-- Logout Button -->
    <form action="/admin-logout" method="POST">
        <button type="submit">Logout</button>
    </form>

</body>

</html>
