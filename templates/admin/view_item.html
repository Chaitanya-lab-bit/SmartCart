<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

```
<title>SmartCart - Product Details</title>
```

</head>

<body>

```
<h2>Product Details</h2>

<!-- Display Product Image -->
<img
    src="{{ url_for('static', filename='uploads/product_images/' + product.image) }}"
    width="200"
    height="200"
    alt="{{ product.name }}">

<br><br>

<!-- Display Product Information -->

<p>
    <strong>Product ID:</strong>
    {{ product.product_id }}
</p>

<p>
    <strong>Name:</strong>
    {{ product.name }}
</p>

<p>
    <strong>Description:</strong>
    {{ product.description }}
</p>

<p>
    <strong>Category:</strong>
    {{ product.category }}
</p>

<p>
    <strong>Price:</strong>
    ₹{{ product.price }}
</p>

<br>

<!-- Navigation Links -->

<a href="/admin/item-list">Back to Product List</a>

<br><br>

<a href="/admin-dashboard">Back to Dashboard</a>
```

</body>

</html>
